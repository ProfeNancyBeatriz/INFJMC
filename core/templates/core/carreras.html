{% extends 'core/base.html' %}

{% block titulo %}Carreras{% endblock %}

{% block contenido %}
    <h1>Carreras del Área</h1>
    <div class="tarjetas">
        {% for c in carreras %}
            <div class="tarjeta">
                <h3>{{ c.nombre }}</h3>
                <p>Jornada: {{ c.jornada }}</p>
                <p>Duración: {{ c.duracion }}</p>
            </div>
        {% empty %}
            <p>No hay carreras registradas.</p>
        {% endfor %}
    </div>
{% endblock %}
