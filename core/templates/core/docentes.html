{% extends 'core/base.html' %}

{% block titulo %}Docentes{% endblock %}

{% block contenido %}
    <h1>Docentes del Área</h1>
    <table class="tabla">
        <thead>
            <tr><th>Nombre</th><th>Asignatura</th></tr>
        </thead>
        <tbody>
            {% for d in docentes %}
                <tr><td>{{ d.nombre }}</td><td>{{ d.asignatura }}</td></tr>
            {% empty %}
                <tr><td colspan="2">No hay docentes registrados.</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
